# Render-Blueprint: ein Docker-Webdienst. Das Passwort muss dasselbe sein wie bei den anderen Spielen
# und der Olympiade, denn daraus wird auch der Schlüssel für die Olympia-Tickets abgeleitet.
services:
  - type: web
    name: loewenkueche
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ZUGANG_PASSWORT
        sync: false
